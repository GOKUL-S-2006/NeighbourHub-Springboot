spring.application.name=neighbourhub-backend

# Loads a local .env file (KEY=value lines) just like dotenv did in Node
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:5000}

# NOTE: the URI must contain the database name, e.g. mongodb+srv://user:pass@host/neighbourhub?...
spring.data.mongodb.uri=${MONGO_URI}
spring.data.mongodb.auto-index-creation=true

# multer had no size limit; Spring defaults to 1MB, so raise it
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Mongoose omits undefined fields; do the same for null
spring.jackson.default-property-inclusion=non_null

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-days=7

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.folder=${CLOUDINARY_FOLDER:your_folder_name}

groq.api-key=${GROQ_API_KEY:}
groq.model=meta-llama/llama-4-scout-17b-16e-instruct

gemini.api-key=${GEMINI_API_KEY:}
gemini.model=gemini-2.0-flash
